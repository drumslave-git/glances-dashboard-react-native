[package]
name = "glances-dashboard"
version = "0.1.0"
description = "A configurable dashboard for Glances system monitors"
authors = ["George Tislenko"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "glances_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# The desktop target's stand-in for the reference app's Electron main process: requests issued
# from Rust are outside the WebView's CORS rules, so a Glances that redirects http -> https, or
# that restricts its origins, is readable here exactly as it is on Android.
tauri-plugin-http = "2"

# The release profile the .exe is built with. `expo export` already ships a
# minified bundle, so the only size left to win is Rust's, and a dashboard has
# no hot loop that LTO would slow down building for.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
